<!DOCTYPE html>
<html>
<head>
    <title>New Ticket — IT Help Desk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Create New Ticket</h1>
    <div class="nav">
        <a href="/">← Back to schedule</a>
        <a href="/jobs">View Tickets</a>
    </div>

    {% if error %}
        <p class="bad">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <p>
            Issue / ticket type:<br>
            <input type="text" name="job_type" placeholder="WiFi not connecting" required>
        </p>
        <p>
            Required skill:<br>
            <input type="text" name="required_skill" placeholder="Network" required>
        </p>
        <p>
            Department:<br>
            <input type="text" name="suburb" placeholder="Finance">
        </p>
        <p>
            Start time (HH:MM, 24-hour):<br>
            <input type="text" name="start_time" placeholder="11:00" required>
        </p>
        <p>
            Duration (hours):<br>
            <input type="text" name="duration" placeholder="2" required>
        </p>
        <button type="submit">Create Ticket</button>
    </form>
</body>
</html>
