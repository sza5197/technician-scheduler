<!DOCTYPE html>
<html>
<head>
    <title>Tickets — IT Help Desk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Tickets</h1>
    <div class="nav">
        <a href="/">← Back to schedule</a>
        <a href="/create-job">+ New Ticket</a>
    </div>

    <table>
        <tr>
            <th>Ticket</th>
            <th>Required skill</th>
            <th>Department</th>
            <th>Time</th>
            <th>Action</th>
        </tr>
        {% for job in jobs %}
        <tr>
            <td>{{ job.job_type }}</td>
            <td>{{ job.required_skill }}</td>
            <td>{{ job.suburb }}</td>
            <td>{{ job.start.strftime("%H:%M") }}–{{ job.end.strftime("%H:%M") }}</td>
            <td><a class="btn" href="/recommend/{{ job.id }}">Find agent</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
